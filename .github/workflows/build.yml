name: Build HopCraft (Portable & Inno Setup)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "README.fa.md"
      - "README.zh.md"
      - "README.ru.md"
      - "LICENSE"
      - "assets/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: x86
            runner: windows-latest
            target: i686-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Run Rust unit tests (x64)
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build HopCraft release binary (${{ matrix.arch }})
        run: cargo build --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Host "Installing Inno Setup 6 via Chocolatey..."
            choco install innosetup -y --no-progress
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "ISCC.exe (Inno Setup 6) not found after installation."
          }
          Write-Host "Using ISCC: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Portable EXE & Inno Setup Installer (${{ matrix.arch }})
        shell: pwsh
        run: |
          $exeSrc = (Resolve-Path "src-tauri/target/${{ matrix.target }}/release/HopCraft.exe").Path
          if (-not (Test-Path $exeSrc)) { throw "Binary not found: $exeSrc" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $distDir = (Resolve-Path "dist").Path
          $portableDst = Join-Path $distDir "HopCraft-windows-${{ matrix.arch }}-portable.exe"
          $setupBase = "HopCraft-windows-${{ matrix.arch }}-setup"
          $setupDst = Join-Path $distDir "$setupBase.exe"

          Copy-Item $exeSrc $portableDst
          $pSize = [math]::Round((Get-Item $portableDst).Length / 1MB, 2)
          Write-Host "Portable:  $portableDst ($pSize MB)"

          $cargoToml = Get-Content "src-tauri/Cargo.toml" -Raw
          if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
            $appVer = $Matches[1]
          } else {
            $appVer = "1.2.1"
          }

          & $env:ISCC_PATH `
            "/DAppVersion=$appVer" `
            "/DAppArch=${{ matrix.arch }}" `
            "/DBinaryPath=$exeSrc" `
            "/DOutputDir=$distDir" `
            "/DOutputBaseFilename=$setupBase" `
            "installer\hopcraft.iss"

          if (-not (Test-Path $setupDst)) { throw "Inno Setup output not found: $setupDst" }
          $sSize = [math]::Round((Get-Item $setupDst).Length / 1MB, 2)
          Write-Host "Installer: $setupDst ($sSize MB)"

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HopCraft-windows-${{ matrix.arch }}
          path: |
            dist/*-portable.exe
            dist/*-setup.exe
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Check if tag is a pre-release
        id: tagcheck
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (Portable + Inno Setup for x64, x86 & ARM64)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*-portable.exe
            release-assets/*-setup.exe
          prerelease: ${{ steps.tagcheck.outputs.prerelease }}
          generate_release_notes: true
