name: Build HopCraft (Portable & MSIX)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "README.fa.md"
      - "README.zh.md"
      - "README.ru.md"
      - "LICENSE"
      - "assets/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            apx_arch: x64
          - arch: x86
            runner: windows-latest
            target: i686-pc-windows-msvc
            apx_arch: x86
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            apx_arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Run Rust unit tests (x64)
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build HopCraft release binary (${{ matrix.arch }})
        run: cargo build --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Package Portable EXE & MSIX (${{ matrix.arch }})
        shell: pwsh
        run: |
          $exeSrc = "src-tauri/target/${{ matrix.target }}/release/HopCraft.exe"
          if (-not (Test-Path $exeSrc)) { throw "Binary not found: $exeSrc" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $portableDst = "dist/HopCraft-windows-${{ matrix.arch }}-portable.exe"
          $msixDst = "dist/HopCraft-windows-${{ matrix.arch }}.msix"

          Copy-Item $exeSrc $portableDst
          $pSize = [math]::Round((Get-Item $portableDst).Length / 1MB, 2)
          Write-Host "Portable: $portableDst ($pSize MB)"

          $makeAppx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $makeAppx) {
            throw "makeappx.exe not found in Windows SDK"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "msix_stage_${{ matrix.arch }}"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path (Join-Path $stageDir "Assets") | Out-Null

          Copy-Item $exeSrc (Join-Path $stageDir "HopCraft.exe")
          Copy-Item "src-tauri/icons/44x44.png" (Join-Path $stageDir "Assets\Square44x44Logo.png") -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $stageDir "Assets\Square44x44Logo.png"))) {
            Copy-Item "src-tauri/icons/32x32.png" (Join-Path $stageDir "Assets\Square44x44Logo.png")
          }
          Copy-Item "src-tauri/icons/128x128.png" (Join-Path $stageDir "Assets\Square150x150Logo.png") -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $stageDir "Assets\Square150x150Logo.png"))) {
            Copy-Item "src-tauri/icons/icon.png" (Join-Path $stageDir "Assets\Square150x150Logo.png")
          }

$manifestLines = @(
  '<?xml version="1.0" encoding="utf-8"?>',
  '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">',
  '  <Identity Name="HosseinGh23.HopCraft" Publisher="CN=HosseinGh23" Version="1.2.1.0" ProcessorArchitecture="${{ matrix.apx_arch }}" />',
  '  <Properties>',
  '    <DisplayName>HopCraft</DisplayName>',
  '    <PublisherDisplayName>HosseinGh23</PublisherDisplayName>',
  '    <Logo>Assets\Square150x150Logo.png</Logo>',
  '  </Properties>',
  '  <Dependencies>',
  '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />',
  '  </Dependencies>',
  '  <Capabilities>',
  '    <rescap:Capability Name="runFullTrust" />',
  '  </Capabilities>',
  '  <Applications>',
  '    <Application Id="HopCraft" Executable="HopCraft.exe" EntryPoint="Windows.FullTrustApplication">',
  '      <uap:VisualElements DisplayName="HopCraft" Description="Native Windows Xray Proxy Chain JSON Generator" BackgroundColor="#202020" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />',
  '    </Application>',
  '  </Applications>',
  '</Package>'
)
[System.IO.File]::WriteAllLines((Join-Path $stageDir "AppxManifest.xml"), $manifestLines, [System.Text.UTF8Encoding]::new($false))