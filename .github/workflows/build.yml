name: Build HopCraft (Portable & NSIS Installer)

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: x86
            runner: windows-latest
            target: i686-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Run Rust unit tests (x64)
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Portable & NSIS Installer (${{ matrix.arch }})
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Collect Portable & NSIS Installer binaries
        shell: pwsh
        run: |
          $portableSrc = "src-tauri/target/${{ matrix.target }}/release/HopCraft.exe"
          if (-not (Test-Path $portableSrc)) { throw "Portable binary not found: $portableSrc" }

          $nsisDir = "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $setupSrc = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setupSrc) { throw "NSIS installer not found in $nsisDir" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $portableDst = "dist/HopCraft-windows-${{ matrix.arch }}.exe"
          $setupDst = "dist/HopCraft-windows-${{ matrix.arch }}-setup.exe"

          Copy-Item $portableSrc $portableDst
          Copy-Item $setupSrc.FullName $setupDst

          $pSize = [math]::Round((Get-Item $portableDst).Length / 1MB, 2)
          $sSize = [math]::Round((Get-Item $setupDst).Length / 1MB, 2)
          Write-Host "Portable:  $portableDst ($pSize MB)"
          Write-Host "Installer: $setupDst ($sSize MB)"

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HopCraft-windows-${{ matrix.arch }}
          path: dist/*.exe
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Check if tag is a pre-release
        id: tagcheck
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (Portable + NSIS for x64, x86 & ARM64)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.exe
          prerelease: ${{ steps.tagcheck.outputs.prerelease }}
          generate_release_notes: true
