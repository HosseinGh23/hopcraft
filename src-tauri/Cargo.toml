[package]
name = "hopcraft"
version = "1.0.0"
description = "HopCraft — Native Windows Xray Proxy Chain JSON Generator"
authors = ["HosseinGh23"]
edition = "2021"

[[bin]]
name = "HopCraft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
arboard = "3"
rfd = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
